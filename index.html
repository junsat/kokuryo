<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>一問一答 暗記帳</title>
<style>
  :root {
    --bg: #0b1020;
    --bg-soft: #12182b;
    --card: #161d33;
    --card-border: #262f4a;
    --ink: #eef1fb;
    --ink-dim: #8891ab;
    --accent: #5b8cff;
    --accent-soft: #263257;
    --good: #34c77b;
    --good-bg: #103322;
    --bad: #ff6b6b;
    --bad-bg: #351515;
    --amber: #f5b544;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overscroll-behavior-y: none;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    background: radial-gradient(circle at 50% -10%, #1a2340 0%, var(--bg) 55%);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow: hidden;
    position: fixed;
    inset: 0;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 8px;
    gap: 10px;
    flex-shrink: 0;
  }
  .topbar .title {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topbar .sub {
    font-size: 0.7rem;
    color: var(--ink-dim);
    font-weight: 600;
  }
  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--ink-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
  }
  .icon-btn:active { background: var(--accent-soft); color: var(--ink); }
  .icon-btn.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  /* ---------- Progress ---------- */
  .progress-wrap {
    padding: 0 16px 10px;
    flex-shrink: 0;
  }
  .progress-bar {
    height: 6px;
    border-radius: 6px;
    background: var(--card);
    overflow: hidden;
    display: flex;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #7aa2ff);
    border-radius: 6px;
    transition: width 0.25s ease;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 0.72rem;
    color: var(--ink-dim);
    font-weight: 600;
  }
  .progress-meta .stat-good { color: var(--good); }
  .progress-meta .stat-bad { color: var(--bad); }

  /* ---------- Card stage ---------- */
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 6px 16px 10px;
    min-height: 0;
    position: relative;
  }

  .card {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 26px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    touch-action: pan-y;
    user-select: none;
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.6);
  }

  .card-face {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 22px;
    text-align: center;
    gap: 18px;
  }

  .qa-label {
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.14em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  .qa-label.answer { color: var(--accent); }

  .card-text {
    font-size: 1.28rem;
    font-weight: 700;
    line-height: 1.55;
    color: var(--ink);
  }
  #card-answer .card-text {
    color: var(--accent);
    font-size: 1.42rem;
  }

  .card-divider {
    width: 40px;
    height: 3px;
    border-radius: 3px;
    background: var(--card-border);
  }

  #card-answer {
    display: none;
    border-top: 1px solid var(--card-border);
    background: rgba(91,140,255,0.05);
  }
  .card.flipped #card-question { display: none; }
  .card.flipped #card-answer { display: flex; }

  .tap-hint {
    position: absolute;
    bottom: 14px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.72rem;
    color: var(--ink-dim);
    font-weight: 600;
    pointer-events: none;
  }

  /* swipe overlay stamps */
  .stamp {
    position: absolute;
    top: 22px;
    padding: 6px 16px;
    border-radius: 10px;
    font-weight: 900;
    font-size: 1rem;
    letter-spacing: 0.05em;
    border: 3px solid;
    opacity: 0;
    transform: scale(0.8) rotate(-8deg);
    transition: opacity 0.08s linear, transform 0.08s linear;
    pointer-events: none;
  }
  .stamp-good { right: 20px; color: var(--good); border-color: var(--good); transform: rotate(-8deg) scale(0.8); }
  .stamp-bad  { left: 20px; color: var(--bad); border-color: var(--bad); transform: rotate(8deg) scale(0.8); }

  /* ---------- Action buttons ---------- */
  .actions {
    display: flex;
    gap: 10px;
    padding: 4px 16px 10px;
    flex-shrink: 0;
  }
  .act-btn {
    flex: 1;
    border: none;
    border-radius: 18px;
    padding: 16px 10px;
    font-size: 0.95rem;
    font-weight: 800;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--card-border);
    transition: transform 0.08s ease;
  }
  .act-btn:active { transform: scale(0.95); }
  .act-btn .emoji { font-size: 1.3rem; }
  .act-btn.bad-btn { color: var(--bad); }
  .act-btn.bad-btn:active { background: var(--bad-bg); }
  .act-btn.good-btn { color: var(--good); }
  .act-btn.good-btn:active { background: var(--good-bg); }
  .act-btn.flip-btn {
    flex: 0.7;
    color: var(--accent);
  }
  .act-btn.flip-btn:active { background: var(--accent-soft); }

  .nav-row {
    display: flex;
    gap: 10px;
    padding: 0 16px;
    flex-shrink: 0;
  }
  .nav-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--ink-dim);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 6px 4px 4px;
  }
  .nav-btn:disabled { opacity: 0.3; }

  /* ---------- Bottom tab bar ---------- */
  .tabbar {
    display: flex;
    border-top: 1px solid var(--card-border);
    background: var(--bg-soft);
    padding: 6px 10px calc(8px + env(safe-area-inset-bottom));
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 4px;
    background: none;
    border: none;
    color: var(--ink-dim);
    font-size: 0.66rem;
    font-weight: 700;
    border-radius: 12px;
  }
  .tab .emoji { font-size: 1.15rem; }
  .tab.active { color: var(--accent); }
  .tab.active .emoji { filter: drop-shadow(0 0 6px rgba(91,140,255,0.5)); }

  /* ---------- List view ---------- */
  .list-view {
    display: none;
    flex: 1;
    flex-direction: column;
    min-height: 0;
    padding: 0 16px 10px;
  }
  .list-view.show { display: flex; }
  .search-box {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 11px 14px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .search-box input {
    flex: 1;
    background: none;
    border: none;
    color: var(--ink);
    font-size: 0.9rem;
    outline: none;
    font-family: inherit;
  }
  .search-box input::placeholder { color: var(--ink-dim); }
  .list-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-bottom: 8px;
  }
  .list-item {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .list-item.wrong { border-color: rgba(255,107,107,0.4); }
  .list-q {
    font-weight: 700;
    font-size: 0.86rem;
    color: #cdd3ea;
    margin-bottom: 6px;
    line-height: 1.5;
  }
  .list-a {
    color: var(--accent);
    font-size: 0.92rem;
    font-weight: 700;
    line-height: 1.5;
  }
  .list-empty {
    text-align: center;
    color: var(--ink-dim);
    font-size: 0.85rem;
    padding: 40px 20px;
  }

  /* ---------- Done screen ---------- */
  .done-view {
    display: none;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
    gap: 18px;
  }
  .done-view.show { display: flex; }
  .done-emoji { font-size: 3rem; }
  .done-title { font-size: 1.3rem; font-weight: 800; }
  .done-stats {
    display: flex;
    gap: 14px;
    margin: 6px 0 4px;
  }
  .done-stat {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 14px 20px;
    min-width: 90px;
  }
  .done-stat .num { font-size: 1.6rem; font-weight: 900; }
  .done-stat.good-stat .num { color: var(--good); }
  .done-stat.bad-stat .num { color: var(--bad); }
  .done-stat .lbl { font-size: 0.68rem; color: var(--ink-dim); font-weight: 700; margin-top: 2px; }
  .done-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; }
  .done-actions button {
    padding: 15px;
    border-radius: 16px;
    border: none;
    font-weight: 800;
    font-size: 0.95rem;
  }
  .done-primary { background: var(--accent); color: white; }
  .done-secondary { background: var(--card); color: var(--ink); border: 1px solid var(--card-border) !important; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- ============ TOP BAR ============ -->
<div class="topbar">
  <div>
    <div class="title">旅行業法・約款 一問一答</div>
    <div class="sub" id="mode-sub">全72問モード</div>
  </div>
  <button class="icon-btn" id="shuffle-btn" title="シャッフル">🔀</button>
</div>

<!-- ============ PROGRESS ============ -->
<div class="progress-wrap" id="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <div class="progress-meta">
    <span id="progress-count">1 / 72</span>
    <span><span class="stat-good" id="good-count">◯0</span>&nbsp;&nbsp;<span class="stat-bad" id="bad-count">✕0</span></span>
  </div>
</div>

<!-- ============ CARD STAGE (study tab) ============ -->
<div class="stage" id="study-view">
  <div class="card" id="flashcard">
    <div class="stamp stamp-good" id="stamp-good">わかった</div>
    <div class="stamp stamp-bad" id="stamp-bad">もう一度</div>

    <div class="card-face" id="card-question">
      <div class="qa-label">Q. 問題</div>
      <div class="card-text" id="q-text"></div>
      <div class="card-divider"></div>
    </div>

    <div class="card-face" id="card-answer">
      <div class="qa-label answer">A. 解答</div>
      <div class="card-text" id="a-text"></div>
    </div>

    <div class="tap-hint" id="tap-hint">タップで解答表示 ／ 左右スワイプで判定</div>
  </div>
</div>

<div class="actions" id="study-actions">
  <button class="act-btn bad-btn" id="btn-bad">
    <span class="emoji">✕</span>もう一度
  </button>
  <button class="act-btn flip-btn" id="btn-flip">
    <span class="emoji">↻</span>答え
  </button>
  <button class="act-btn good-btn" id="btn-good">
    <span class="emoji">◯</span>わかった
  </button>
</div>

<!-- ============ DONE VIEW ============ -->
<div class="done-view" id="done-view">
  <div class="done-emoji">🎉</div>
  <div class="done-title" id="done-title">1周終了！</div>
  <div class="done-stats">
    <div class="done-stat good-stat"><div class="num" id="done-good">0</div><div class="lbl">わかった</div></div>
    <div class="done-stat bad-stat"><div class="num" id="done-bad">0</div><div class="lbl">もう一度</div></div>
  </div>
  <div class="done-actions">
    <button class="done-primary" id="btn-review-wrong">苦手問題だけ復習する</button>
    <button class="done-secondary" id="btn-restart-all">最初からやり直す</button>
  </div>
</div>

<!-- ============ LIST VIEW ============ -->
<div class="list-view" id="list-view">
  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="search-input" placeholder="キーワードで検索…">
  </div>
  <div class="list-scroll" id="list-scroll"></div>
</div>

<!-- ============ BOTTOM TAB BAR ============ -->
<div class="tabbar">
  <button class="tab active" id="tab-study" data-tab="study">
    <span class="emoji">🗂️</span>学習
  </button>
  <button class="tab" id="tab-wrong" data-tab="wrong">
    <span class="emoji">🎯</span>苦手のみ
  </button>
  <button class="tab" id="tab-list" data-tab="list">
    <span class="emoji">📋</span>一覧
  </button>
</div>

  ["片道400キロ以上の通用期間（フェリー）", "7日間"],
  ["回数券の通用期間（フェリー）", "発売当日含め2ヶ月"],
  ["乗船券紛失後の払戻可能期間", "通用期間経過1年以内"],
  ["受託手荷物・小荷物の損害賠償請求期間（フェリー）", "引き渡しの日より14日以内"],
  ["宿泊申込金の限度（宿泊期間3泊以上）", "3日間の基本宿泊料"],
  ["時間外客室利用の追加料金が室料金の3分の1の超過時間", "3時間まで"],
  ["時間外客室利用の追加料金が室料金の2分の1の超過時間", "6時間まで"],
  ["時間外客室利用の追加料金が室料金の全額の超過時間", "6時間以上"],
  ["忘れ物の保管期間（ホテル・旅館）", "発見日含め7日間"],
  ["指定のある乗車券類の乗車変更可能期間", "出発時刻前（団体は2時間前）"],
  ["指定のない乗車券類の乗車変更可能期間", "有効期間内"],
  ["乗車券類紛失時の払戻請求期間（個人）", "1年以内"]
];

// マスターデータ（id付与）
const master = RAW_DATA.map((d, i) => ({ id: i, q: d[0], a: d[1] }));

// ---- 状態管理 ----
let deck = [];              // 現在の学習キュー（idの配列）
let currentPos = 0;
let goodCount = 0;
let badCount = 0;
let wrongIds = new Set();   // このセッションで一度でも「もう一度」を押したid
let mode = 'all';           // 'all' or 'wrong'
let activeTab = 'study';
let isFlipped = false;

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startDeck(ids, label) {
  deck = shuffleArray(ids);
  currentPos = 0;
  goodCount = 0;
  badCount = 0;
  wrongIds = new Set();
  document.getElementById('mode-sub').textContent = label;
  document.getElementById('done-view').classList.remove('show');
  document.getElementById('study-view').classList.remove('hidden');
  document.getElementById('study-actions').classList.remove('hidden');
  document.getElementById('progress-wrap').classList.remove('hidden');
  renderCard();
}

function startAll() {
  mode = 'all';
  startDeck(master.map(m => m.id), `全${master.length}問モード`);
}

function startWrongOnly(ids, label) {
  mode = 'wrong';
  if (ids.length === 0) {
    // nothing to review
  }
  startDeck(ids, label);
}

function currentCard() {
  return master[deck[currentPos]];
}

function renderCard() {
  if (currentPos >= deck.length) {
    showDone();
    return;
  }
  const item = currentCard();
  document.getElementById('q-text').textContent = item.q;
  document.getElementById('a-text').textContent = item.a;

  const card = document.getElementById('flashcard');
  card.classList.remove('flipped');
  isFlipped = false;

  document.getElementById('progress-count').textContent = `${currentPos + 1} / ${deck.length}`;
  document.getElementById('progress-fill').style.width = `${(currentPos / deck.length) * 100}%`;
  document.getElementById('good-count').textContent = `◯${goodCount}`;
  document.getElementById('bad-count').textContent = `✕${badCount}`;
}

function showDone() {
  document.getElementById('study-view').classList.add('hidden');
  document.getElementById('study-actions').classList.add('hidden');
  document.getElementById('progress-wrap').classList.add('hidden');
  document.getElementById('progress-fill').style.width = '100%';

  const dv = document.getElementById('done-view');
  dv.classList.add('show');
  document.getElementById('done-good').textContent = goodCount;
  document.getElementById('done-bad').textContent = badCount;

  const reviewBtn = document.getElementById('btn-review-wrong');
  if (wrongIds.size > 0) {
    document.getElementById('done-title').textContent = '1周終了！';
    reviewBtn.style.display = 'block';
    reviewBtn.textContent = `苦手問題だけ復習する（${wrongIds.size}問）`;
  } else {
    document.getElementById('done-title').textContent = '全問クリア！お見事 🎉';
    reviewBtn.style.display = 'none';
  }
}

function toggleFlip() {
  if (currentPos >= deck.length) return;
  const card = document.getElementById('flashcard');
  isFlipped = !isFlipped;
  card.classList.toggle('flipped', isFlipped);
}

function judge(known) {
  if (currentPos >= deck.length) return;
  const item = currentCard();
  if (known) {
    goodCount++;
  } else {
    badCount++;
    wrongIds.add(item.id);
  }
  currentPos++;
  renderCard();
}

function flashStamp(kind) {
  const el = document.getElementById(kind === 'good' ? 'stamp-good' : 'stamp-bad');
  el.style.opacity = '1';
  el.style.transform = kind === 'good' ? 'rotate(-8deg) scale(1)' : 'rotate(8deg) scale(1)';
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = kind === 'good' ? 'rotate(-8deg) scale(0.8)' : 'rotate(8deg) scale(0.8)';
  }, 220);
}

// ---- タップ / スワイプ操作 ----
const flashcard = document.getElementById('flashcard');
let touchStartX = 0, touchStartY = 0, touchMoved = false;

flashcard.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
  touchMoved = false;
}, { passive: true });

flashcard.addEventListener('touchmove', () => { touchMoved = true; }, { passive: true });

flashcard.addEventListener('touchend', (e) => {
  const endX = e.changedTouches[0].screenX;
  const endY = e.changedTouches[0].screenY;
  const dx = endX - touchStartX;
  const dy = endY - touchStartY;

  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0) {
      flashStamp('good');
      setTimeout(() => judge(true), 120);
    } else {
      flashStamp('bad');
      setTimeout(() => judge(false), 120);
    }
  } else if (!touchMoved) {
    toggleFlip();
  }
}, { passive: true });

document.getElementById('btn-flip').addEventListener('click', toggleFlip);
document.getElementById('btn-good').addEventListener('click', () => { flashStamp('good'); setTimeout(() => judge(true), 100); });
document.getElementById('btn-bad').addEventListener('click', () => { flashStamp('bad'); setTimeout(() => judge(false), 100); });

document.getElementById('shuffle-btn').addEventListener('click', () => {
  const remainingIds = deck.slice(currentPos);
  deck = deck.slice(0, currentPos).concat(shuffleArray(remainingIds));
  const btn = document.getElementById('shuffle-btn');
  btn.classList.add('on');
  setTimeout(() => btn.classList.remove('on'), 250);
});

document.getElementById('btn-review-wrong').addEventListener('click', () => {
  const ids = Array.from(wrongIds);
  setActiveTab('study');
  startWrongOnly(ids, `苦手復習モード（${ids.length}問）`);
});

document.getElementById('btn-restart-all').addEventListener('click', () => {
  setActiveTab('study');
  startAll();
});

// キーボード操作（PCプレビュー用）
document.addEventListener('keydown', (e) => {
  if (activeTab !== 'study') return;
  if (e.key === 'ArrowRight' || e.key === 'k') judge(true);
  else if (e.key === 'ArrowLeft' || e.key === 'j') judge(false);
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleFlip(); }
});

// ---- タブ切り替え ----
function setActiveTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));

  const studyView = document.getElementById('study-view');
  const studyActions = document.getElementById('study-actions');
  const progressWrap = document.getElementById('progress-wrap');
  const doneView = document.getElementById('done-view');
  const listView = document.getElementById('list-view');

  if (tab === 'list') {
    studyView.classList.add('hidden');
    studyActions.classList.add('hidden');
    progressWrap.classList.add('hidden');
    doneView.classList.remove('show');
    listView.classList.add('show');
    renderList(document.getElementById('search-input').value);
  } else if (tab === 'wrong') {
    listView.classList.remove('show');
    const ids = Array.from(wrongIds);
    startWrongOnly(ids, ids.length ? `苦手復習モード（${ids.length}問）` : '苦手な問題はまだありません');
    if (ids.length === 0) {
      document.getElementById('study-view').classList.add('hidden');
      document.getElementById('study-actions').classList.add('hidden');
      document.getElementById('progress-wrap').classList.add('hidden');
      const dv = document.getElementById('done-view');
      dv.classList.add('show');
      document.getElementById('done-title').textContent = '苦手な問題はまだありません';
      document.getElementById('done-good').textContent = '0';
      document.getElementById('done-bad').textContent = '0';
      document.getElementById('btn-review-wrong').style.display = 'none';
      document.getElementById('btn-restart-all').textContent = '学習モードへ戻る';
      document.getElementById('btn-restart-all').onclick = () => { setActiveTab('study'); };
    }
  } else {
    listView.classList.remove('show');
    if (deck.length === 0 || currentPos === 0) {
      // fresh entry, keep whatever was in progress; if nothing started yet, start all
    }
    studyView.classList.remove('hidden');
    if (currentPos < deck.length) {
      studyActions.classList.remove('hidden');
      progressWrap.classList.remove('hidden');
      doneView.classList.remove('show');
    }
    document.getElementById('btn-restart-all').textContent = '最初からやり直す';
    document.getElementById('btn-restart-all').onclick = () => { setActiveTab('study'); startAll(); };
  }
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => setActiveTab(t.dataset.tab));
});

// ---- 一覧表示 ----
function renderList(filterText) {
  const scroll = document.getElementById('list-scroll');
  scroll.innerHTML = '';
  const f = (filterText || '').trim();
  const filtered = master.filter(item =>
    !f || item.q.includes(f) || item.a.includes(f)
  );

  if (filtered.length === 0) {
    scroll.innerHTML = '<div class="list-empty">該当する項目がありません</div>';
    return;
  }

  filtered.forEach(item => {
    const div = document.createElement('div');
    div.className = 'list-item' + (wrongIds.has(item.id) ? ' wrong' : '');
    div.innerHTML = `<div class="list-q">・${item.q}</div><div class="list-a">${item.a}</div>`;
    scroll.appendChild(div);
  });
}

document.getElementById('search-input').addEventListener('input', (e) => {
  renderList(e.target.value);
});

// ---- 初期化 ----
startAll();
</script>
</body>
</html>
